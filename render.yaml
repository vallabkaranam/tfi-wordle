services:
  # Backend Service
  - type: web
    name: tfi-wordle-backend
    runtime: python
    repo: https://github.com/vallabkaranam/tfi-wordle
    plan: free
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.src.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: CORS_ORIGINS
        sync: false  # User must provide
      - key: TMDB_READ_TOKEN
        sync: false  # Required for live TMDB refresh/search
      - key: CACHE_REFRESH_TIMEZONE
        value: America/New_York
      - key: CACHE_REFRESH_HOUR_ET
        value: 6
      - key: CACHE_REFRESH_MINUTE_ET
        value: 0

  # Frontend Service
  - type: web
    name: tfi-wordle-frontend
    runtime: node
    repo: https://github.com/vallabkaranam/tfi-wordle
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false  # User must provide (backend URL + /api)
