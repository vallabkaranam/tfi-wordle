services:
  # Backend Service
  - type: web
    name: tfi-wordle-backend
    runtime: python
    repo: https://github.com/vallabkaranam/tfi-wordle
    plan: starter
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: movie-cache
      mountPath: /var/data/tfi-wordle
      sizeGB: 5
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: CORS_ORIGINS
        sync: false  # User must provide
      - key: TMDB_READ_TOKEN
        sync: false  # Required for live TMDB refresh/search
      - key: CACHE_REFRESH_TIMEZONE
        value: America/New_York
      - key: CACHE_REFRESH_HOUR_ET
        value: 6
      - key: CACHE_REFRESH_MINUTE_ET
        value: 0
      - key: MOVIE_CACHE_DIR
        value: /var/data/tfi-wordle
      - key: REFRESH_JOB_TOKEN
        generateValue: true

  # Frontend Service
  - type: web
    name: tfi-wordle-frontend
    runtime: node
    repo: https://github.com/vallabkaranam/tfi-wordle
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false  # User must provide (backend URL + /api)

  # Daily cache refresh backup job
  - type: cron
    name: tfi-wordle-refresh-cache
    runtime: python
    repo: https://github.com/vallabkaranam/tfi-wordle
    plan: starter
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python backend/scripts/http_job.py
    schedule: "0 10 * * *"
    envVars:
      - key: JOB_KIND
        value: refresh
      - key: BACKEND_BASE_URL
        sync: false  # Set to your backend Render URL, e.g. https://tfi-wordle-backend.onrender.com
      - key: REFRESH_JOB_TOKEN
        fromService:
          name: tfi-wordle-backend
          type: web
          envVarKey: REFRESH_JOB_TOKEN

  # Stopgap keepalive ping to reduce cold starts
  - type: cron
    name: tfi-wordle-keepalive
    runtime: python
    repo: https://github.com/vallabkaranam/tfi-wordle
    plan: starter
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python backend/scripts/http_job.py
    schedule: "*/10 * * * *"
    envVars:
      - key: JOB_KIND
        value: health
      - key: BACKEND_BASE_URL
        sync: false  # Set to your backend Render URL, e.g. https://tfi-wordle-backend.onrender.com
